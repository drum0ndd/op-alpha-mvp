name: opalpha-tests
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: opalpha_test
      POSTGRES_PASSWORD: opalpha_test_only
      POSTGRES_DB: opalpha_test
    ports:
      - '127.0.0.1:5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U opalpha_test -d opalpha_test']
      interval: 2s
      timeout: 3s
      retries: 20
